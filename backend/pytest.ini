[pytest]
testpaths = tests

# The app imports itself as `app.*`, so backend/ must be on sys.path. Doing it
# here rather than with a sys.path hack in conftest keeps `pytest` working from
# this directory with no packaging or editable install.
pythonpath = .

addopts = -q --strict-markers

markers =
    db: needs a reachable PostgreSQL; auto-skipped when there isn't one.
    live: needs a running Ollama with OLLAMA_MODEL pulled. Minutes, not
        seconds -- skipped unless --live is passed.

filterwarnings =
    # starlette.testclient warns that httpx is deprecated in favour of httpx2,
    # but ollama pins httpx, so the app cannot move yet.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
